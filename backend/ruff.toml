target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Много развёрнутых русскоязычных комментариев-объяснений (см.
    # logs/DECISIONS_LOG.md — почему именно так) — обрезать их по формальной
    # длине строки не даёт пользы для качества кода, только шум.
    "E501",
    # `Depends(...)` как значение по умолчанию — обязательный паттерн FastAPI
    # DI, а не баг "вызов функции в default-аргументе".
    "B008",
    # `datetime.UTC`/`enum.StrEnum` — модернизация синтаксиса без изменения
    # поведения (Python 3.11+). Проект последовательно использует
    # `timezone.utc`/`(str, enum.Enum)` во всём коде и тестах (80+ мест) —
    # переписывать это ради стиля прямо перед сдачей не даёт пользы,
    # соразмерной риску (последний раз путаница вокруг именно enum-статуса
    # `BookingStatus` стоила реальной поломки, см. DECISIONS_LOG 2026-09-18).
    "UP017",
    "UP042",
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
# `Mapped["Booking"]`-подобные строковые forward-ref аннотации — стандартный
# паттерн типизированных relationship в SQLAlchemy 2.0: класс разрешается
# самим ORM-маппером в момент configure, а не импортом Python. Модели
# намеренно не импортируют друг друга напрямую (иначе — циклический импорт),
# поэтому ruff не может статически увидеть класс — F821 здесь false positive.
# UP037 по той же причине опасен автофиксом: снятие кавычек превратило бы
# `Mapped["Booking"]` в `Mapped[Booking]` и упало бы NameError при загрузке
# модуля, так как класс реально не импортирован.
"app/models/*.py" = ["F821", "UP037"]
